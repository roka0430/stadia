<!DOCTYPE html>
<html lang="ja">


<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/popup.css">
  <link rel="stylesheet" href="../assets/css/category.css">
  <title>Stadia | Category</title>
</head>

<body>
  <main x-data="main">
    <section class="control">
      <a href="/" class="control__back" title="ホームへ戻る" aria-label="ホームへ戻る">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M15 6l-6 6l6 6" />
        </svg>
      </a>
      <button class="control__new" @click="newCategory()" title="カテゴリを新規作成">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-folder-plus">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M12 19h-7a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v3.5" />
          <path d="M16 19h6" />
          <path d="M19 16v6" />
        </svg>
        <span>New</span>
      </button>
    </section>
    <section class="categories">
      <template x-if="categories.length === 0 && !$store.category.isLoading">
        <p class="categories__no-category" x-cloak>利用可能なカテゴリがありません。新規作成してください。</p>
      </template>
      <template x-for="category in categories">
        <div class="categories__item category">
          <div class="category__name" x-text="category.name"></div>
          <div class="category__menu">
            <button @click="editCategory(category.id)" title="カテゴリを編集" aria-label="カテゴリを編集">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-pencil">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" />
                <path d="M13.5 6.5l4 4" />
              </svg>
            </button>
            <button @click="deleteCategory(category.id)" title="カテゴリを削除" aria-label="カテゴリを削除">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-trash">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 7l16 0" />
                <path d="M10 11l0 6" />
                <path d="M14 11l0 6" />
                <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
              </svg>
            </button>
          </div>
        </div>
      </template>
    </section>
  </main>

  <div class="popup" x-data="popup" x-show="context !== null" x-cloak @keydown.window.escape="if (context !== null) cancel()">
    <div class="popup__body" @click.outside="cancel()">
      <div class="popup__header">
        <div class="popup__title" x-text="title"></div>
        <button class="popup__exit" @click="cancel()">×</button>
      </div>
      <div class="popup__contents" x-ref="popupContents" @input="input()">
        <template x-if="context === 'new-category'">
          <div class="popup__content" data-content="new-category" x-data="popupCategoryName">
            <label class="popup__input-label">
              <span>カテゴリ名</span>
              <input type="text" class="popup__input" x-model="name" @focus="$el.select()" autocomplete="off">
            </label>
          </div>
        </template>
        <template x-if="context === 'edit-category'">
          <div class="popup__content" data-content="edit-category" x-data="popupCategoryName">
            <label class="popup__input-label">
              <span>カテゴリ名</span>
              <input type="text" class="popup__input" x-model="name" @focus="$el.select()" autocomplete="off">
            </label>
          </div>
        </template>
        <template x-if="context === 'delete-category'">
          <div class="popup__content" data-content="delete-category">
            <p>このカテゴリを削除しますか？</p>
            <label class="popup__checkbox">
              <input type="checkbox">
              <span>このカテゴリと学習記録を削除することに同意します</span>
            </label>
          </div>
        </template>
      </div>
      <div class="popup__controls">
        <button class="popup__cancel" x-show="type !== 'alert'" @click="cancel()">キャンセル</button>
        <button class="popup__action" x-text="confirm" :disabled="disable" :data-type="type" @click="action()"></button>
      </div>
    </div>
  </div>

  <script type="module" src="../assets/js/category.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
