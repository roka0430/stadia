<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Stadia</title>
</head>

<body x-data="body">
  <div class="app">
    <header>header</header>

    <main>
      <button @click="overlayId = 'overlay1'">overlay1</button>
      <button @click="overlayId = 'overlay2'">overlay2</button>
      <button @click="overlayId = 'overlay3'">overlay3</button>
    </main>

    <footer>footer</footer>
  </div>

  <div class="overlays" x-show="overlayId !== null" x-cloak>
    <div class="overlay" id="overlay1" x-show="overlayId === $el.id">
      <div class="overlay-header">
        <div class="overlay-header__left">
          <button class="overlay-header__close" @click="closeOverlay()"></button>
          <h2 class="overlay-header__title">overlay1</h2>
        </div>
        <div class="overlay-header__right"></div>
      </div>
    </div>
    <div class="overlay" id="overlay2" x-show="overlayId === $el.id">
      <div class="overlay-header">
        <div class="overlay-header__left">
          <button class="overlay-header__close" @click="closeOverlay()"></button>
          <h2 class="overlay-header__title">overlay2</h2>
        </div>
        <div class="overlay-header__right"></div>
      </div>
    </div>
    <div class="overlay" id="overlay3" x-show="overlayId === $el.id">
      <div class="overlay-header">
        <div class="overlay-header__left">
          <button class="overlay-header__close" @click="closeOverlay()"></button>
          <h2 class="overlay-header__title">overlay3</h2>
        </div>
        <div class="overlay-header__right"></div>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
