<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Stadia</title>
</head>

<body x-data="body">
  <h1 x-show="false">Stadia</h1>

  <main>
    <section class="main-section analytics">
      <h2 class="main-section__title">Analytics</h2>
      <div class="main-section__content">
        <h3 class="main-section__subtitle">勉強時間</h3>
        <div class="analytics__study-hours">
          <div class="analytics__study-hours-item">
            <span>今日</span>
            <span><span x-text="studyHours.today"></span>時間</span>
          </div>
          <div class="analytics__study-hours-item">
            <span>今日</span>
            <span><span x-text="studyHours.period"></span>時間</span>
          </div>
        </div>
        <h3 class="main-section__subtitle">過去7日間</h3>
        <div class="analytics__weekly-chart weekly-chart">
          <div class="weekly-chart__bars">
            <div class="weekly-chart__bar"></div>
            <div class="weekly-chart__bar"></div>
            <div class="weekly-chart__bar"></div>
            <div class="weekly-chart__bar"></div>
            <div class="weekly-chart__bar"></div>
            <div class="weekly-chart__bar"></div>
            <div class="weekly-chart__bar"></div>
          </div>
          <div class="weekly-chart__labels">
            <div class="weekly-chart__label"><span>8/2</span><span>1h</span></div>
            <div class="weekly-chart__label"><span>8/2</span><span>1h</span></div>
            <div class="weekly-chart__label"><span>8/2</span><span>1h</span></div>
            <div class="weekly-chart__label"><span>8/2</span><span>1h</span></div>
            <div class="weekly-chart__label"><span>8/2</span><span>1h</span></div>
            <div class="weekly-chart__label"><span>8/2</span><span>1h</span></div>
            <div class="weekly-chart__label"><span>8/2</span><span>1h</span></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="overlays" x-show="overlayId !== null" x-cloak>
    <div class="overlay" id="study" x-show="overlayId === $el.id">
      <div class="overlay-header">
        <div class="overlay-header__left">
          <button class="overlay-header__close" @click="closeOverlay()"></button>
          <h2 class="overlay-header__title">study</h2>
        </div>
        <div class="overlay-header__right"></div>
      </div>
    </div>

    <div class="overlay" id="overlay2" x-show="overlayId === $el.id">
      <div class="overlay-header">
        <div class="overlay-header__left">
          <button class="overlay-header__close" @click="closeOverlay()"></button>
          <h2 class="overlay-header__title">overlay2</h2>
        </div>
        <div class="overlay-header__right"></div>
      </div>
    </div>

    <div class="overlay" id="overlay3" x-show="overlayId === $el.id">
      <div class="overlay-header">
        <div class="overlay-header__left">
          <button class="overlay-header__close" @click="closeOverlay()"></button>
          <h2 class="overlay-header__title">overlay3</h2>
        </div>
        <div class="overlay-header__right"></div>
      </div>
    </div>
  </div>

  <aside class="shortcut-bar">
    <span><kbd>Esc</kbd> 閉じる</span>
    <span><kbd>Esc</kbd> 閉じる</span>
    <span><kbd>Esc</kbd> 閉じる</span>
  </aside>

  <script src="script.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
