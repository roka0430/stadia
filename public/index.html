<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Stadia</title>
</head>

<body x-data="body">
  <div class="app">
    <header>header</header>

    <main>
      <button @click="overlayId = 'overlay1'">overlay1</button>
      <button @click="overlayId = 'overlay2'">overlay2</button>
      <button @click="overlayId = 'overlay3'">overlay3</button>
    </main>

    <footer>footer</footer>
  </div>

  <div class="overlays" x-show="overlayId !== null">
    <div class="overlay" id="overlay1" x-show="overlayId === $el.id">
      overlay1
      <button @click="overlayId = null">閉じる</button>
    </div>
    <div class="overlay" id="overlay2" x-show="overlayId === $el.id">
      overlay2
      <button @click="overlayId = null">閉じる</button>
    </div>
    <div class="overlay" id="overlay3" x-show="overlayId === $el.id">
      overlay3
      <button @click="overlayId = null">閉じる</button>
    </div>
  </div>

  <script src="script.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
