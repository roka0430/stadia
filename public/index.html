<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <title>Stadia</title>
</head>

<body x-data="body">
  <div class="wrapper">
    <header>
      <div class="dropdown category" x-data="category" :class="{ 'opened': isOpen }" @click.outside="isOpen = false">
        <button class="dropdown__current" @click="isOpen = !isOpen">
          <span class="dropdown__current-name" x-text="$store.category.currentCategory?.name"></span>
          <svg class="dropdown__indicator" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-selector">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M8 9l4 -4l4 4" />
            <path d="M16 15l-4 4l-4 -4" />
          </svg>
        </button>
        <div class="dropdown__menu">
          <div class="dropdown__label">Select category</div>
          <template x-for="category in $store.category.categories" :key="category.id">
            <div
              class="dropdown__option"
              :class="{ 'current': category.id === $store.category.currentCategory?.id }"
              x-text="category.name"
              @click="selectCategory(category.id)"></div>
          </template>
        </div>
      </div>
    </header>

    <main class="home" x-data="home">
      <section class="home__section home__start">
        <button class="start__button" @click="startStudy()">学習を開始</button>
      </section>
      <section class="home__section home__today">
        <div class="today__box">
          <div class="today__box-label">今日の学習時間</div>
          <div class="today__box-content">
            <span x-show="todayStudyData.hours !== 0" x-text="todayStudyData.hours"></span>
            <span x-show="todayStudyData.hours !== 0" class="unit">時間</span>
            <span x-show="todayStudyData.hours === 0 || todayStudyData.minutes !== 0" x-text="todayStudyData.minutes"></span>
            <span x-show="todayStudyData.hours === 0 || todayStudyData.minutes !== 0" class="unit">分</span>
          </div>
        </div>
        <div class=" today__separator"></div>
        <div class="today__box">
          <div class="today__box-label">今日の学習回数</div>
          <div class="today__box-content">
            <span x-text="todayRecords.length"></span>
            <span class="unit">回</span>
          </div>
        </div>
      </section>
      <section class="home__section home__statistics">
        <div class="home__statistics-label">科目別学習時間</div>
        <div class="statistics__subjects">
          <div
            class="statistics__subjects-graph"
            x-data="{
              summarizeSubjectStudyData(n) {
                const data = this.sortedSubjectStudyData;
                const top = data.slice(0, n).map(([name, {seconds}]) => ({name, seconds}));
                const other = data.slice(n).reduce((sum, [, {seconds}]) => sum + seconds, 0);
                if(other > 0) {
                  top.push({name: 'その他', seconds: other});
                }
                return top;
              },
              get summarizedSubjectStudyData() {
                return this.summarizeSubjectStudyData(4);
              },
              get subjectPercentages() {
                let total = 0;
                return this.summarizedSubjectStudyData.map(({ seconds }) => {
                  total += seconds;
                  return total / this.totalStudyData.seconds * 100;
                });
              }
            }">
            <div
              class="statistics__subjects-circle"
              :class="{'no-subject': sortedSubjectStudyData.length === 0}"
              :style="{
                '--subject-1': `${subjectPercentages[0] ?? 100}%`,
                '--subject-2': `${subjectPercentages[1] ?? 100}%`,
                '--subject-3': `${subjectPercentages[2] ?? 100}%`,
                '--subject-4': `${subjectPercentages[3] ?? 100}%`,
                '--subject-5': `${subjectPercentages[4] ?? 100}%`
              }">
            </div>
            <div class="statistics__subjects-legend">
              <div x-show="subjectPercentages[0]" x-text="summarizedSubjectStudyData?.[0]?.name"></div>
              <div x-show="subjectPercentages[1]" x-text="summarizedSubjectStudyData?.[1]?.name"></div>
              <div x-show="subjectPercentages[2]" x-text="summarizedSubjectStudyData?.[2]?.name"></div>
              <div x-show="subjectPercentages[3]" x-text="summarizedSubjectStudyData?.[3]?.name"></div>
              <div x-show="subjectPercentages[4]" x-text="summarizedSubjectStudyData?.[4]?.name"></div>
            </div>
          </div>
          <div class="statistics__subjects-separator"></div>
          <div class="statistics__subjects-list">
            <template x-if="$store.category.records.length === 0">
              <div class="statistics__subjects-list-message">
                科目がありません
              </div>
            </template>
            <template x-for="[name, data] in sortedSubjectStudyData" :key="name">
              <div class="statistics__subjects-list-item">
                <div x-text="name"></div>
                <div>
                  <span x-text="data.string"></span>
                  (<span x-text="calcPercent(data.seconds, totalStudyData.seconds)">100%</span>)
                </div>
              </div>
            </template>
          </div>
        </div>
        <div class="home__statistics-label">過去7日間のデータ</div>
        <div
          class="statistics__weekly"
          x-data="{
            get records() {
              return getStudyDataByPastDays(7).toReversed();
            },
            get maxSeconds() {
              return Math.max(...this.records.map(({ data }) => data.seconds));;
            }
          }">
          <div class="statistics__weekly-bars">
            <template x-for="record in records">
              <div class="statistics__weekly-bar" :style="`--height: ${maxSeconds ? record.data.seconds / maxSeconds * 100 : 0}%;`">
                <div class="statistics__weekly-value" x-text="record.data.string"></div>
              </div>
            </template>
          </div>
          <div class="statistics__weekly-labels">
            <template x-for="record in records">
              <div class="statistics__weekly-label">
                <template x-if="isToday(record.date)">
                  <span>今日</span>
                </template>
                <template x-if="!isToday(record.date)">
                  <span x-text="formatDate(record.date, 'M/DD')"></span>
                </template>
              </div>
            </template>
          </div>
        </div>
      </section>
      <section class="home__section home__total">
        <div class="total__cards">
          <div class="total__card">
            <div class="total__card-label">総学習時間</div>
            <div class="total__card-value" x-text="totalStudyData.string"></div>
          </div>
          <div class="total__card">
            <div class="total__card-label">総学習回数</div>
            <div class="total__card-value"><span x-text="$store.category.records.length"></span>回</div>
          </div>
          <div class="total__card">
            <div class="total__card-label">学習日数</div>
            <div class="total__card-value"><span x-text="studyDates.length"></span>日</div>
          </div>
          <div class="total__card">
            <div class="total__card-label">平均学習時間</div>
            <div class="total__card-value"><span x-text="calcStudyData($store.category.records.length ? totalStudyData.seconds / $store.category.records.length : 0).string"></span></div>
          </div>
        </div>
      </section>
      <section class="home__section home__records">
        <div class="records__label">過去の記録</div>
        <div class="records__list">
          <template x-if="$store.category.records.length === 0">
            <div class="records__no-record-message">記録がありません</div>
          </template>
          <template x-for="record in $store.category.records" :key="record.id">
            <div class="records__item">
              <span class="records__date" x-text="formatDate(record.date, 'YY-MM-DD HH:mm')"></span>
              <span class="records__name" x-text="record.name"></span>
              <span class="records__time" x-text="calcStudyData(record.time).string"></span>
              <span class="records__menu">
                <button @click="editRecord(record.id)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-pencil">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" />
                    <path d="M13.5 6.5l4 4" />
                  </svg>
                </button>
                <button @click="deleteRecord(record.id)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-trash">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M4 7l16 0" />
                    <path d="M10 11l0 6" />
                    <path d="M14 11l0 6" />
                    <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                    <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
                  </svg>
                </button>
              </span>
            </div>
          </template>
        </div>
      </section>
    </main>

    <div class="study" x-data="study" x-show="isStudying" x-cloak>
      <div class="study__header">
        <button class="study__header-button study__exit" @click="exitStudy()"><span>×</span>終了</button>
        <button class="study__header-button study__record" @click="recordStudy()">記録</button>
      </div>
      <div class="study__content">
        <div class="study__timer" :class="{'is-paused': isTimerPaused}">
          <div class="study__timer-content">
            <span class="time" x-text="formattedTime.hours"></span>
            <span class="colon">:</span>
            <span class="time" x-text="formattedTime.minutes"></span>
          </div>
          <div class="study__timer-indicator"></div>
        </div>
        <button class="study__start-stop" :class="{'is-paused': isTimerPaused}" @click="toggleTimer()">
          <span class="study__start-stop-content" x-show="isTimerPaused">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-player-play">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M7 4v16l13 -8l-13 -8" />
            </svg>
            <span>スタート</span>
          </span>
          <span class="study__start-stop-content" x-show="!isTimerPaused">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-player-pause">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M6 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12" />
              <path d="M14 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12" />
            </svg>
            <span>ストップ</span>
          </span>
        </button>
      </div>
    </div>

    <div class="popup" x-data="popup" x-show="context !== null" x-cloak @keydown.window.escape="if(context !== null) cancel()">
      <div class="popup__body" @click.outside="cancel()">
        <div class="popup__header">
          <div class="popup__title" x-text="title"></div>
          <button class="popup__exit" @click="cancel()">×</button>
        </div>
        <div class="popup__contents" x-ref="popupContents" @input="input()">
          <template x-if="context === 'edit-record'" x-data="popupEditRecord">
            <div class="popup__content" data-content="edit-record">
              <label class="popup__input-label">
                <span>科目名</span>
                <input type="text" class="popup__input" x-model="name" @focus="$el.select()">
              </label>
              <label class="popup__input-label">
                <span>学習時間</span>
                <input type="text" class="popup__input" x-model="time" @focus="$el.select()">
              </label>
            </div>
          </template>
          <template x-if="context === 'delete-record'">
            <div class="popup__content" data-content="delete-record">
              <p>この記録を削除しますか？</p>
              <label class="popup__checkbox">
                <input type="checkbox">
                <span>この記録を削除することに同意します</span>
              </label>
            </div>
          </template>
          <template x-if="context === 'exit-study'">
            <div class="popup__content" data-content="exit-study">
              <p>学習記録を破棄して終了しますか？</p>
            </div>
          </template>
          <template x-if="context === 'record-study'" x-data="popupRecordStudy">
            <div class="popup__content" data-content="record-study">
              <p>科目を選択してください。</p>
              <div class="dropdown popup__dropdown" x-data="category" :class="{ 'opened': isOpen }" @click.outside="isOpen = false">
                <button class="dropdown__current" @click="isOpen = !isOpen">
                  <span class="dropdown__current-name" x-text="selectedSubjectName"></span>
                  <svg class="dropdown__indicator" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-selector">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M8 9l4 -4l4 4" />
                    <path d="M16 15l-4 4l-4 -4" />
                  </svg>
                </button>
                <div class="dropdown__menu">
                  <div class="dropdown__label">Select subject</div>
                  <template x-for="subjectName in $store.category.subjectNames" :key="subjectName">
                    <div
                      class="dropdown__option"
                      :class="{ 'current': subjectName === selectedSubjectName }"
                      x-text="subjectName"
                      @click="selectSubject(subjectName)"></div>
                  </template>
                  <div class="dropdown__option popup__new-subject" @click="createNewSubject()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-plus">
                      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                      <path d="M12 5l0 14" />
                      <path d="M5 12l14 0" />
                    </svg>
                    <span>新しい科目</span>
                  </div>
                </div>
              </div>
            </div>
          </template>
          <template x-if="context === 'create-new-subject'">
            <div class="popup__content" data-content="create-new-subject">
              <p>新しい科目名を入力してください。</p>
              <input type="text" class="popup__input">
            </div>
          </template>
          <template x-if="context === 'study-too-short'">
            <div class="popup__content" data-content="study-too-short">
              <p>学習時間が1分未満のため、記録できません。</p>
            </div>
          </template>
        </div>
        <div class="popup__controls">
          <button class="popup__cancel" @click="cancel()">キャンセル</button>
          <button class="popup__action" x-text="confirm" :disabled="disable" :data-type="type" @click="action()"></button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/home.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
